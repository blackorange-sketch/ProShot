name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/proshot.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/proshot.jks" >> "$GITHUB_ENV"
            echo "Signing with the fixed ProShot key"
          else
            echo "No KEYSTORE_B64 secret: using the default debug key"
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # If the native (C++) part cannot be built on this runner, fall back to the Kotlin-only build.
          gradle assembleDebug --stacktrace || gradle assembleDebug --stacktrace -PnoNative

      - uses: actions/upload-artifact@v4
        with:
          name: ProShot-debug
          path: app/build/outputs/apk/debug/*.apk
